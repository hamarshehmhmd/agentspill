name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q -rs

  demo-vs-gitleaks:
    name: demo repo, compared with gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: build the demo repo (fake secrets generated at runtime)
        run: python examples/make_demo_repo.py /tmp/shop-api
      - name: gitleaks (for comparison, informational)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          cd /tmp/shop-api
          /tmp/gitleaks git . --no-banner --report-format json --report-path /tmp/gl.json || true
          python -c 'import json; print("gitleaks findings:", len(json.load(open("/tmp/gl.json"))))'
      - name: agentspill finds every planted secret
        run: |
          cd /tmp/shop-api
          set +e; agentspill --color always scan --history; rc=$?; set -e
          test "$rc" -eq 1
          agentspill scan --history --format json --fail-on none > /tmp/as.json
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "examples")
          import make_demo_repo
          d = json.load(open("/tmp/as.json"))
          fps = {f["fingerprint"] for f in d["findings"]}
          import hashlib
          want = {hashlib.sha256(s.encode()).hexdigest()[:12] for s in make_demo_repo.SECRETS.values()}
          print("agentspill distinct secrets:", len(fps), "planted:", len(want))
          assert want <= fps, want - fps
          PY
      - name: fix, then the working tree is clean
        run: |
          cd /tmp/shop-api
          agentspill fix --write
          sed -i 's#postgres://admin:[^@]*@#postgres://admin:${STAGING_DB_PASSWORD}@#' CLAUDE.md
          agentspill scan
          agentspill scan --history --format checklist --fail-on none

  install-script:
    name: one-line install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: AGENTSPILL_REF=${{ github.sha }} sh install.sh
      - run: |
          export PATH="$HOME/.local/bin:${PIPX_BIN_DIR:-/opt/pipx_bin}:$PATH"
          agentspill --version
          agentspill scan . --fail-on none

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
        with:
          fail-on: high
